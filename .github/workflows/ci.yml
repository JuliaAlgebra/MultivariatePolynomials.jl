name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.implementation }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Since MultivariatePolynomials doesn't have binary dependencies,
        # only test on a subset of possible platforms.
        # `implementation` is the package implementing the variables used by
        # the tests. `SimplePolynomials` is defined in `test/SimplePolynomials.jl`.
        include:
          - version: '1'
            os: ubuntu-latest
            arch: x64
            implementation: SimplePolynomials
          - version: '1.10'
            os: ubuntu-latest
            arch: x64
            implementation: SimplePolynomials
          - version: '1'
            os: ubuntu-latest
            arch: x86
            implementation: SimplePolynomials
          - version: 'pre'
            os: ubuntu-latest
            arch: x64
            implementation: SimplePolynomials
          - version: '1'
            os: ubuntu-latest
            arch: x64
            implementation: DynamicPolynomials
          - version: '1'
            os: ubuntu-latest
            arch: x64
            implementation: TypedPolynomials
#          - version: 'nightly'
#            os: ubuntu-latest
#            arch: x64
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v3
      - name: Remove Mooncake on Julia v1.14
        shell: julia {0}
        run: |
          using TOML
          # Mooncake supports Julia 1.10--1.13. Keep testing MP on newer
          # Julia versions without asking Pkg to resolve Mooncake there.
          if VERSION >= v"1.14-"
              path = joinpath("test", "Project.toml")
              project = TOML.parsefile(path)
              for section in ("deps", "compat"), name in ("Mooncake", "JET", "AllocCheck")
                  delete!(project[section], name)
              end
              open(io -> TOML.print(io, project), path, "w")
          end
      - name: Add ${{ matrix.implementation }} to the test environment
        if: matrix.implementation != 'SimplePolynomials'
        shell: julia --project=test {0}
        run: |
          using Pkg
          Pkg.add(PackageSpec(name="${{ matrix.implementation }}", rev="bl/ordering_instance"))
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          test_args: ${{ matrix.implementation }}
        #  depwarn: error # Had to disable it because DataStructures does
        #    1 dependency had output during precompilation:
        # ┌ DataStructures
        # │  WARNING: DataStructures.DisjointSets is deprecated, use DisjointSet instead.
        # │    likely near /home/blegat/.julia/dev/DataStructures/src/deprecations.jl:9
        # │  WARNING: DataStructures.DisjointSets is deprecated, use DisjointSet instead.
        # │    likely near /home/blegat/.julia/dev/DataStructures/src/deprecations.jl:9
        # │  WARNING: DataStructures.DisjointSets is deprecated, use DisjointSet instead.
        # │    likely near /home/blegat/.julia/dev/DataStructures/src/deprecations.jl:9
        # └
        # No idea why, try enabling it back later
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v7
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
